# =====================================================================
# Perfil 'cloud' — servicio multi-tenant sobre Postgres (Railway).
# Se activa con SPRING_PROFILES_ACTIVE=cloud. NO afecta el arranque local-first
# por defecto. Ver docs/40-multitenant.md.
#
# Credenciales y secretos vienen de variables de entorno (nada en el repo).
# =====================================================================
server:
  # Railway inyecta PORT.
  port: ${PORT:8081}

spring:

  # V36 — UN CAMPO DESCONOCIDO EN EL PAYLOAD FALLA RUIDOSAMENTE.
  #
  # Estaba apagado, que es el valor por defecto de Spring Boot, y por eso el POS
  # llevaba meses mandando `createdAt` en el payload de la orden
  # (offline-order.repository.ts:25) mientras el servidor lo descartaba sin un
  # solo error. La fecha del dispositivo viajaba y se perdia en silencio.
  #
  # Con esto, un campo que el DTO no declara devuelve 400 en vez de evaporarse.
  # Es ruidoso a proposito: preferimos que un despliegue falle en staging a que
  # un dato se pierda callado durante meses.
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    # La app corre como rol NO superusuario para que RLS aplique.
    username: ${DB_APP_USER:app_user}
    password: ${DB_APP_PASSWORD:app_pw}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      # ── Conexiones ociosas: el pooler las cierra y Hikari no se enteraba ──
      #
      # Medido en Producción el 2026-08-25 a las 22:11, tras unas horas sin
      # tráfico (local cerrado):
      #
      #   HikariPool-1 - Connection is not available, request timed out after
      #   30048ms (total=9, active=0, idle=9, waiting=0)
      #   Caused by: PSQLException: This connection has been closed. (08003)
      #
      # Nueve conexiones ociosas y las nueve MUERTAS. El pooler de Supabase las
      # había cerrado por inactividad; Hikari las seguía entregando, la petición
      # esperaba 30 s y el login devolvía 500. Al reintentar se recupera —Hikari
      # desaloja las muertas— pero el primer usuario del día se come el fallo.
      #
      # Nunca se notó porque en horario de servicio hay tráfico constante y las
      # conexiones no llegan a estar ociosas tanto tiempo. Se ve justo cuando
      # más duele: la PRIMERA venta de la mañana.
      #
      # ── 2026-08-26, corrección ───────────────────────────────────────────
      #
      # 🔴 Lo de arriba se escribió el 25 y NO ARREGLÓ NADA, por dos motivos
      # independientes:
      #
      # 1. Este bloque no lo leía nadie. `DataSourceConfig` construía el pool
      #    sin `@ConfigurationProperties`, así que Hikari corría con TODOS sus
      #    valores por defecto. Arreglado ahí; el javadoc lo cuenta.
      # 2. Los 15 minutos de `max-lifetime` estaban mal calibrados. Medido en
      #    Producción: hubo tráfico a las 23:21 y a las 23:28 las conexiones ya
      #    estaban muertas. La ventana real es de MENOS DE 7 MINUTOS, así que
      #    retirarlas a los 15 llega tarde siempre.
      #
      # Los valores de abajo se eligen contra esa medición, no contra un número
      # redondo:
      #
      #   max-lifetime      4 min   por debajo de la ventana de 7 min observada
      #   keepalive-time    30 s    una muerta se detecta en 30 s, no en 2 min
      #   idle-timeout      2 min   en reposo el pool baja a `minimum-idle`
      #   minimum-idle      2       con solo 2 ociosas, el peor caso de la
      #                             mañana son 2 validaciones fallidas, no 9
      #   validation-timeout 3 s    cada muerta cuesta 3 s en vez de 5
      #
      # El peor caso pasa de «30 s y un 500» a «6 s y la venta entra».
      #
      # No se toca `connection-timeout`: bajarlo haría fallar antes bajo carga
      # real, que es un problema distinto y peor.
      max-lifetime: 240000
      keepalive-time: 30000
      idle-timeout: 120000
      validation-timeout: 3000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    # Las migraciones (crean el rol app_user, etc.) corren con un usuario
    # PRIVILEGIADO, distinto del rol de aplicación.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    user: ${DB_MIGRATION_USER:postgres}
    password: ${DB_MIGRATION_PASSWORD:postgres}
    locations: classpath:db/migration

# Segunda cadena Flyway (esquemas `pedidos` y `red`): la corre FlywayPedidos,
# NUNCA un @Bean Flyway (apagaría la de `public`). Usa la conexión de arriba.
pedidos:
  flyway:
    enabled: ${PEDIDOS_FLYWAY_ENABLED:true}

# Desactiva la maquinaria local-first (outbox/sync-inversa/segundo datasource).
sync:
  cloud:
    enabled: false

# Secreto para validar el JWT del tenant.
security:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-en-produccion-min-32-bytes!}

# N2/6.5 — clave de autorización para borrar órdenes desde el POS.
# Vacía = se conserva el comportamiento anterior (rol admin + motivo obligatorio
# + auditoría). Al fijarla (env ORDER_DELETE_PASSWORD) se exige además la clave.
order:
  delete:
    password: ${ORDER_DELETE_PASSWORD:}
