server:
  port: 8081
spring:

  # V36 — UN CAMPO DESCONOCIDO EN EL PAYLOAD FALLA RUIDOSAMENTE.
  #
  # Estaba apagado, que es el valor por defecto de Spring Boot, y por eso el POS
  # llevaba meses mandando `createdAt` en el payload de la orden
  # (offline-order.repository.ts:25) mientras el servidor lo descartaba sin un
  # solo error. La fecha del dispositivo viajaba y se perdia en silencio.
  #
  # Con esto, un campo que el DTO no declara devuelve 400 en vez de evaporarse.
  # Es ruidoso a proposito: preferimos que un despliegue falle en staging a que
  # un dato se pierda callado durante meses.
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  # F5.7b: la foto y la firma de una entrega pesan como mucho 1 MB cada una (lo comprueba Pedidos con su 413).
  # El tope del servidor va algo por encima para que ese 413 salga con su mensaje y no con el error genérico.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB
  # Multi-tenancy (B1): las migraciones Flyway son SOLO para el esquema Postgres
  # cloud. Se desactiva el auto-run para NO ejecutarlas contra el SQLite local.
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:./data/ms_order_product.db
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: update
    show-sql: false
logging:
  level:
    com.suresell.order.serivices: INFO
  application:
    name: ms-order-product
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
coupon:
  admin:
    password: Admin2025*
sync:
  scheduler:
    fixed-delay-ms: 5000
    batch-size: 20
  cloud:
    # ⚠️ CORREGIDO 2026-08-20 — este perfil (el POR DEFECTO, o sea el que corre
    # en la máquina de un desarrollador) tenía aquí la URL y las credenciales del
    # Supabase de PRODUCCIÓN, con `enabled: true`. Un `./gradlew bootRun` local
    # sincronizaba contra la base real.
    #
    # Ahora: apagado por defecto y sin destino hardcodeado. Quien de verdad
    # necesite probar la sincronización local-first exporta las tres variables
    # apuntando a SU base, nunca a producción.
    #
    # NO afecta al despliegue: el perfil `cloud` fija `sync.cloud.enabled=false`
    # (application-cloud.yml:41) y ahí este bloque ni se usa — el adaptador no
    # llega a instanciarse (@ConditionalOnProperty en SyncOutboxScheduler:14).
    enabled: ${SYNC_CLOUD_ENABLED:false}
    datasource:
      driver-class-name: org.postgresql.Driver
      url: ${SYNC_CLOUD_DB_URL:jdbc:postgresql://localhost:5432/postgres}
      username: ${SYNC_CLOUD_DB_USER:postgres}
      password: ${SYNC_CLOUD_DB_PASSWORD:postgres}
      hikari:
        maximum-pool-size: 4
        minimum-idle: 1
        idle-timeout: 30000
        max-lifetime: 1800000
